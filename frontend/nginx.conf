server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the API so the browser sees one origin and CORS is moot in
    # production. The dev server (vite, M2) proxies separately.
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Analyses are long-running; do not cut them off at nginx's default 60s.
        proxy_read_timeout 300s;
    }

    # WebSocket progress stream (M10-13).
    location /ws/ {
        proxy_pass         http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /docs      { proxy_pass http://api:8000/docs; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # Raster tiles from TiTiler (M2-3).
    location /tiles/ {
        proxy_pass http://titiler:8000/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
