server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Match the API's own 50 MB ceiling (MAX_UPLOAD_BYTES). nginx defaults to
    # 1 MB, which rejects a real contour map -- the sample alone is 6.4 MB --
    # before the request ever reaches FastAPI, so the API's size guard and its
    # RFC 7807 response would never fire. Keep the two limits equal: nginx is a
    # backstop, the API is the authority.
    client_max_body_size 50m;

    # A body past that is refused here, so answer in the same problem+json shape
    # the API uses. The UI then parses one error format instead of two, and the
    # user reads a sentence rather than nginx's HTML error page.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/problem+json;
        return 413 '{"type":"/errors/upload-too-large","title":"Upload too large","status":413,"detail":"The uploaded file is larger than the 50 MB limit. Clip the contour map to the area you care about and try again."}';
    }

    # Reverse-proxy the API so the browser sees one origin and CORS is moot in
    # production. The dev server (vite, M2) proxies separately.
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Analyses are long-running; do not cut them off at nginx's default 60s.
        proxy_read_timeout 300s;
    }

    # WebSocket progress stream (M10-13).
    location /ws/ {
        proxy_pass         http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # FastAPI's own documentation URLs. All three, because `docs_url`,
    # `redoc_url` and `openapi_url` are all set in app/main.py -- and an unlisted
    # one does not 404 here, it falls through to the SPA below and returns
    # index.html with HTTP 200. Swagger UI then reports "the provided definition
    # does not specify a valid version field", which points at the spec rather
    # than at the missing proxy rule. Keep this list and vite.config.ts's proxy
    # in step: whichever one is short is the one that breaks.
    location /docs         { proxy_pass http://api:8000/docs; }
    location /redoc        { proxy_pass http://api:8000/redoc; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # Raster tiles from TiTiler (M2-8).
    #
    # TiTiler is an optional service: the contour API needs no tile server, so a
    # plain `docker compose up` runs without it. nginx resolves a literal
    # upstream at config-parse time and refuses to start if the name is missing,
    # which would take the whole UI down over a service nobody asked for. Going
    # through a variable defers the lookup to request time -- absent TiTiler,
    # /tiles/ answers 502 and every other route keeps working.
    location /tiles/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # docker's embedded DNS
        set $titiler http://titiler:8000;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $titiler;
        proxy_set_header Host $host;

        # TiTiler sends its own Cache-Control, and nginx's `add_header` appends
        # rather than replacing -- so the response carried two of them, which
        # browsers and caches resolve differently. Hide the upstream's and send
        # exactly one.
        #
        # `immutable` is honest here because COG paths are content-addressed by
        # a hash of the inputs: a different DEM produces a different path, so the
        # bytes at any given URL never change.
        # Hide the upstream's, and do not use nginx's `expires` directive
        # either: `expires` emits a Cache-Control of its own, so combining it
        # with `add_header` produced two of them -- both from nginx. One
        # explicit header says everything, `Expires` included (max-age
        # supersedes it for every cache built this century).
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # SPA fallback: unknown paths serve index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
