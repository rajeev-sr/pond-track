name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app

      - name: Black
        run: black --check app

      - name: Mypy (domain layer)
        run: mypy app/core app/config.py

      # No network in CI: external providers are replayed from VCR cassettes
      # (M11-2), so a provider outage can never turn the build red.
      - name: Tests
        run: pytest app/tests -q --cov=app/core --cov=app/config.py --cov-report=term-missing

  docker:
    name: Docker — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t contour-api:ci --target dev ./backend
      - name: Build frontend image
        run: docker build -t contour-frontend:ci ./frontend
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 8000:8000 contour-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then echo && exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs api; exit 1
